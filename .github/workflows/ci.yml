name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - run: corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --immutable

      - run: yarn lint

      - run: yarn typecheck

      # Also enforces publint and attw - both run inside tsdown on every build.
      - run: yarn build

      - run: yarn test

      # Packs all 13 packages, installs the tarballs outside the workspace and
      # runs the real CLI against examples/clean-node. Needs network.
      - run: yarn verify:pack
